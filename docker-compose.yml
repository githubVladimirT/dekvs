services:
  node0:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node0
    hostname: node0
    ports:
      - "8080:8080"
      - "9090:9090"
    command: >
      --id=node0
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node0:9090
      --grpc-port=8080
      --join=false
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  node1:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node1
    hostname: node1
    ports:
      - "8081:8080"
      - "9091:9090"
    command: >
      --id=node1
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node1:9090
      --grpc-port=8080
      --join=true
      --leader-addrs=node0:8080
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    depends_on:
      node0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node2
    hostname: node2
    ports:
      - "8082:8080"
      - "9092:9090"
    command: >
      --id=node2
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node2:9090
      --grpc-port=8080
      --join=true
      --leader-addrs=node0:8080
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    depends_on:
      node0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node3
    hostname: node3
    ports:
      - "8083:8080"
      - "9093:9090"
    command: >
      --id=node3
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node3:9090
      --grpc-port=8080
      --join=true
      --leader-addrs=node0:8080
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    depends_on:
      node0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  node4:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node4
    hostname: node4
    ports:
      - "8084:8080"
      - "9094:9090"
    command: >
      --id=node4
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node4:9090
      --grpc-port=8080
      --join=true
      --leader-addrs=node0:8080
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    depends_on:
      node0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  node5:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    container_name: dekvs-node5
    hostname: node5
    ports:
      - "8085:8080"
      - "9095:9090"
    command: >
      --id=node5
      --raft-bind-addr=0.0.0.0:9090
      --raft-adv-addr=node5:9090
      --grpc-port=8080
      --join=true
      --leader-addrs=node0:8080
      --enable-metrics=true
      --metrics-port=19090
    networks:
      - dekvs-network
    depends_on:
      node0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "-max-time", "5", "localhost:8080", "kv.KVService/Get"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dekvs-prometheus
    ports:
      - "30090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - dekvs-network
    depends_on:
      - node0
      - node1
      - node2
      - node3
      - node4
      - node5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dekvs-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - dekvs-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  dekvs-network:
    driver: bridge

volumes:
  grafana-storage:
